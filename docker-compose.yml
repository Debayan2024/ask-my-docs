# docker-compose.yml
# list down all services that this docker compose file will run
# 1. ollama
services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama_service
    ports:
      - "11434:11434"
    volumes:
    # Named volumes to persist ollama models and data across container restart
      - ollama_data:/root/.ollama
    restart: unless-stopped # Restart Ollama if it stops, unless explicitly stopped by user

  # ChromaDB Server Service
  chromadb:
    # image: chromadb/chroma:latest # Use the official ChromaDB server image
    build:
      context: .
      dockerfile: Dockerfile.Chroma
    container_name: chromadb_server
    ports:
      - "8001:8000" # Expose Chroma's default API port for external access (optional)
    volumes:
      # Persist Chroma's data (it uses SQLite internally here, but it's managed by the Chroma server)
      - chroma_data:/data
    environment:
      # Configure Chroma server to store data at /chroma/data
      # This tells the Chroma server where to put its internal SQLite files.
      # - CHROMA_API_IMPL=uvicorn.run
      # - CHROMA_SERVER_HOST=0.0.0.0
      # - CHROMA_SERVER_PORT=8000
      # - IS_PERSISTENT=TRUE
      - PERSIST_DIRECTORY=/chroma/data # This is the path INSIDE the Chroma container
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v2/heartbeat"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  #2. RAG API Service
  rag_api:
    build:
      context: . # path containing rag_api docker file
      dockerfile: Dockerfile
    container_name: rag_api_service
    ports:
      - "8000:8000"
    volumes:
      # Mount the local vector store directory (created by run_ingest.py) into the container
      # The API app needs to read this. Mount as read-only (:ro) for safety.
      - ./vector_store:/app/output/vector_store:ro
      # Optional: Mount your local config directory for easier config changes without rebuilding.
      # Ensure ollama_base_url in this config is 'http://ollama:11434'
      - ./config:/app/config:ro
    depends_on:
      ollama:
        condition: service_started
      chromadb:
        condition: service_healthy
    environment:
      # Set environment variables for the application if needed
      PYTHONUNBUFFERED: "1" # Ensures Python output (like logs) is sent straight to console
      PYTHONDONTWRITEBYTECODE: "1" # Prevents Python from writing .pyc files
      # Example: If your app could take OLLAMA_BASE_URL from env to override config:
      # OLLAMA_BASE_URL: "http://ollama:11434"
    restart: unless-stopped # Restart the API service if it stops, unless explicitly stopped

# Defines named volumes used by the services
volumes:
  ollama_data: # This volume will be created by Docker to persist Ollama's data
  chroma_data: